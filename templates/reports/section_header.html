<header class="report-header">
    <div class="report-header-copy">
        <p class="report-eyebrow">{{ eyebrow|default:"Farm Report" }}</p>
        <h2>{{ title }}</h2>
        <p class="report-subtitle">{{ subtitle }}</p>
        <div class="report-header-meta">
            <span class="report-header-tag"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg>{% if date_from or date_to %}{{ date_from|default:"Start" }} &rarr; {{ date_to|default:"Today" }}{% else %}All time{% endif %}</span>
            {% if year %}<span class="report-header-tag">Year {{ year }}</span>{% endif %}
            <span class="report-header-tag">{{ currency.code }}</span>
        </div>
    </div>
    <div class="report-header-actions page-actions">
        {% include "reports/export_menu.html" %}
        <button class="btn btn-secondary" type="button" onclick="window.print()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
            Print
        </button>
    </div>
</header>
