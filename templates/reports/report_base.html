{% extends "dashboard/base.html" %}
{% block title %}{{ report_title }} - FarmLedger Pro{% endblock %}
{% block extra_head %}
<style>
    h1 { color: #2d5016; border-bottom: 2px solid #4a7c2e; padding-bottom: 10px; }
    h2 { color: #4a7c2e; margin-top: 20px; }
    table { width: 100%; border-collapse: collapse; margin: 15px 0; }
    th { background: #4a7c2e; color: white; padding: 10px; text-align: left; }
    td { padding: 8px 10px; border-bottom: 1px solid #ddd; }
    tr:hover { background: #f0f7ed; }
    .total-row { font-weight: bold; background: #e8f5e9; }
    .export-links { margin: 15px 0; }
    .export-links a { display: inline-block; margin-right: 10px; padding: 8px 16px; background: #4a7c2e; color: white; text-decoration: none; border-radius: 4px; font-size: 14px; }
    .export-links a:hover { background: #2d5016; }
    .filters { margin: 15px 0; padding: 15px; background: #f5f5f5; border-radius: 4px; }
    .filters label { margin-right: 5px; font-weight: bold; }
    .filters input, .filters select { width: auto; margin-right: 15px; padding: 5px; }
    .positive { color: #2e7d32; }
    .negative { color: #c62828; }
</style>
{% endblock %}
{% block content %}{% endblock %}
